<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polyfy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 29,9.5 29,22.5 16,30 3,22.5 3,9.5' fill='%232a78d6'/%3E%3Cpath d='M16 9v7l5 3' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f8f9fb; --line:#e3e6eb; --line-strong:#cfd4dc;
  --text:#14171c; --text-2:#52596a; --muted:#8a91a0;
  --accent:#2a78d6; --accent-hover:#256abf; --accent-soft:#e6f0fc;
  --good:#1a7f4b; --good-soft:#e3f4ea; --warn:#a86600; --warn-soft:#fdf1dc; --bad:#c62f2f; --bad-soft:#fde7e7;
  --bar:#2a78d6; --grid:#eceef2;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadow-lg:0 12px 32px rgba(16,24,40,.18);
  --r:10px; --r-sm:6px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121417; --surface:#1b1e23; --surface-2:#22262c; --line:#2e333b; --line-strong:#3c424c;
    --text:#f1f2f4; --text-2:#b8bec9; --muted:#8a91a0;
    --accent:#3987e5; --accent-hover:#5598e7; --accent-soft:#1b2c42;
    --good:#4cc283; --good-soft:#173326; --warn:#e2a33a; --warn-soft:#3a2c14; --bad:#ef6b6b; --bad-soft:#3d1c1c;
    --bar:#3987e5; --grid:#2a2f36;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121417; --surface:#1b1e23; --surface-2:#22262c; --line:#2e333b; --line-strong:#3c424c;
  --text:#f1f2f4; --text-2:#b8bec9; --muted:#8a91a0;
  --accent:#3987e5; --accent-hover:#5598e7; --accent-soft:#1b2c42;
  --good:#4cc283; --good-soft:#173326; --warn:#e2a33a; --warn-soft:#3a2c14; --bad:#ef6b6b; --bad-soft:#3d1c1c;
  --bar:#3987e5; --grid:#2a2f36;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 14px/1.5 var(--font);min-height:100vh}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:22px;font-weight:700}
h2{font-size:16px;font-weight:600}
h3{font-size:14px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:12px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- Layout ---------- */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;padding:4px 8px 16px;letter-spacing:-.01em}
.brand svg{width:28px;height:28px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);color:var(--text-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.active{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.nav-sec{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.nav-clock{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent)}
.side{overflow-y:auto}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.me{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--r-sm);cursor:pointer;color:var(--text);background:none;border:0;font:inherit;text-align:left;width:100%}
.me:hover{background:var(--surface-2)}
.me .who{min-width:0}
.me .who div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{min-width:0;display:flex;flex-direction:column}
.content{padding:24px;max-width:1280px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mobile-top{display:none}

/* ---------- Timer bar ---------- */
.timerbar{display:flex;gap:10px;align-items:center;padding:10px 12px 10px 16px}
.timerbar input.desc{flex:1;min-width:120px;border:0;background:transparent;font-size:15px;padding:8px 4px}
.timerbar input.desc:focus{outline:none}
.timerbar .clock{font-size:20px;font-weight:600;min-width:96px;text-align:right}
.timerbar.running{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}


/* ---------- Controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);padding:7px 12px;border-radius:var(--r-sm);font:500 14px var(--font);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{color:var(--bad);border-color:var(--line-strong)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.icon{padding:6px;width:32px;height:32px}
.btn svg{width:16px;height:16px}
.btn.start{background:var(--accent);border-color:var(--accent);color:#fff;min-width:96px;font-weight:600}
.btn.stop{background:var(--bad);border-color:var(--bad);color:#fff;min-width:96px;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:7px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
label.field,div.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--text-2)}
label.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font:500 13px var(--font);color:var(--text-2);cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.billable-toggle{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);border-radius:var(--r-sm);width:34px;height:34px;font-weight:700;cursor:pointer}
.billable-toggle.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.tagbtn{max-width:220px;color:var(--muted)}
.tagbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagbtn.on{color:var(--accent)}
.tagpop{position:fixed;z-index:70;width:260px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);box-shadow:var(--shadow-lg);padding:8px;display:flex;flex-direction:column;gap:6px}
.tagpop .list{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.tagpop .list label.check{padding:5px 6px;border-radius:4px}
.tagpop .list label.check:hover{background:var(--surface-2)}
.tagpop .list .btn{justify-content:flex-start}
button.tag.tagedit{cursor:pointer;font-family:inherit}
button.tag.tagedit:hover{border-color:var(--accent);color:var(--accent)}
.notice{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.notice code{background:var(--surface);padding:1px 5px;border-radius:4px}
details summary{cursor:pointer}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-body{padding:16px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{padding:16px}
.tile .label{font-size:12px;color:var(--text-2);font-weight:500}
.tile .value{font-size:28px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.tile .sub{font-size:12px;color:var(--muted);margin-top:2px}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:20px}
.meter{height:6px;background:var(--grid);border-radius:3px;overflow:hidden;margin-top:8px}
.meter>span{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter.over>span{background:var(--warn)}

/* ---------- Tables / lists ---------- */
table{width:100%;border-collapse:collapse}
th,td{padding:10px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--text-2);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.table-wrap{overflow-x:auto}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.proj{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--line)}
.tag.admin{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.live{background:var(--good-soft);color:var(--good);border-color:transparent}
.tag.off{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.day-group .day-head{display:flex;justify-content:space-between;padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:600;font-size:13px;color:var(--text-2)}
.entry{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .desc{min-width:0}
.entry .desc div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .times{color:var(--text-2);font-size:13px}
.entry .dur{font-weight:600;min-width:64px;text-align:right}
.entry .acts{display:flex;gap:2px;opacity:.6}
.entry:hover .acts{opacity:1}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12px;flex:none}

/* ---------- Charts ---------- */
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart .axis text{fill:var(--muted);font-size:11px}
.chart .gridline{stroke:var(--grid);stroke-width:1}
.chart .baseline{stroke:var(--line-strong);stroke-width:1}
.chart .barval{fill:var(--text-2);font-size:11px;font-weight:600}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover+.bar,.chart .bar.hover{opacity:.8}
.tip{position:fixed;z-index:100;pointer-events:none;background:var(--text);color:var(--surface);padding:6px 10px;border-radius:var(--r-sm);font-size:12px;box-shadow:var(--shadow-lg);white-space:nowrap}
.tip b{font-weight:600}
.hbars{display:flex;flex-direction:column;gap:12px}
.hbar .top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.hbar .track{height:8px;background:var(--grid);border-radius:4px;margin-top:6px;overflow:hidden}
.hbar .fill{height:100%;border-radius:0 4px 4px 0}

/* ---------- Calendar ---------- */
.cal{display:grid;grid-template-columns:56px repeat(var(--cols,7),1fr);overflow:hidden}
.cal-headrow{display:contents}
.cal-dayhead{padding:10px 8px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);text-align:center;background:var(--surface-2)}
.cal-dayhead .dn{font-size:12px;color:var(--text-2);font-weight:500}
.cal-dayhead .dd{font-size:18px;font-weight:600}
.cal-dayhead.today .dn,.cal-dayhead.today .tot{color:var(--accent)}
.cal-dayhead.today .dd{color:var(--accent)}
.cal-dayhead .tot{font-size:11px;color:var(--muted)}
.cal-scroll{max-height:calc(100vh - 230px);overflow-y:auto;grid-column:1/-1;display:grid;grid-template-columns:56px repeat(var(--cols,7),1fr);position:relative}
.cal-hours{position:relative}
.cal-hours div{font-size:11px;color:var(--muted);text-align:right;padding-right:8px;transform:translateY(-7px)}
.cal-col{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hp) - 1px),var(--grid) calc(var(--hp) - 1px),var(--grid) var(--hp));cursor:copy}
.cal-col.today{background-color:color-mix(in srgb,var(--accent-soft) 40%,transparent)}
.cal-ev{position:absolute;border-radius:6px;padding:4px 6px;font-size:12px;overflow:hidden;cursor:pointer;color:var(--text);border:1px solid var(--surface);line-height:1.3}
.cal-ev:hover{filter:brightness(.97);z-index:3}
.cal-ev .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ev .s{color:var(--text-2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ev.running{border:1px dashed var(--accent)}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:4;pointer-events:none}
.now-line::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,20,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:14px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;outline:none}
.swatch.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text)}

/* ---------- Uitklapmenu, periodekiezer, filterbalk ---------- */
.menu{position:fixed;z-index:70;min-width:200px;max-width:360px;max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);box-shadow:var(--shadow-lg);padding:6px;display:flex;flex-direction:column;gap:2px}
.menu.wide{width:340px}
.menu>input{margin:2px 2px 6px}
.menu .list{display:flex;flex-direction:column;gap:1px;overflow:auto;max-height:52vh}
.mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:7px 8px;font:inherit;color:var(--text);cursor:pointer}
.mi:hover{background:var(--surface-2)}
.mi.on{background:var(--accent-soft);color:var(--accent)}
.mi.danger{color:var(--bad)}
.mi svg{width:16px;height:16px}
.mh{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 8px 2px}
.range{display:inline-flex}
.range .btn{border-radius:0;margin-left:-1px}
.range .btn:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm);margin-left:0;min-width:180px;justify-content:flex-start}
.range .btn:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.filterbar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:8px 12px}
.flabel{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:8px}
.fbtn{display:inline-flex;align-items:center;gap:4px;background:none;border:0;border-right:1px solid var(--line);padding:6px 12px;font:inherit;color:var(--text-2);cursor:pointer}
.fbtn svg{width:14px;height:14px}
.fbtn.on{color:var(--accent)}
.filterbar>input{margin-left:8px}
.sumband{display:flex;gap:24px;align-items:baseline;flex-wrap:wrap;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
.sumband b{font-size:18px}
.cnt{min-width:24px;height:24px;padding:0 6px;border-radius:4px;border:1px solid var(--line-strong);background:var(--accent-soft);color:var(--accent);font:600 12px var(--font);cursor:pointer;margin-right:8px}
.cnt.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sum-split{display:grid;grid-template-columns:1fr 280px;align-items:start}
.sum-split .donut-wrap{border-left:1px solid var(--line);padding:16px}
table.tree tr.g2 td{background:var(--surface-2);padding-left:48px;font-size:13px}
table.weekly th,table.weekly td{white-space:nowrap}
table.weekly tfoot th{border-top:1px solid var(--line-strong)}

/* ---------- Time Tracker ---------- */
.projbtn,.te-proj{max-width:280px;color:var(--accent);font-weight:500}
.projbtn span,.te-proj span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.projbtn .pn,.te-proj .pn{font-weight:500}
.tb-times{display:inline-flex;align-items:center;gap:4px}
.tb-times input{padding:6px}
.tb-times input.hm{width:62px;text-align:center}
.tb-dur{width:122px;border:0;background:transparent;font-size:20px;font-weight:600;text-align:right}
.modes{display:flex;flex-direction:column;gap:2px;margin-left:4px}
.modes button{border:0;background:none;color:var(--muted);cursor:pointer;padding:1px;line-height:0}
.modes button.on{color:var(--accent)}
.modes svg{width:16px;height:16px}
.wk-head{display:flex;justify-content:space-between;align-items:baseline;padding:8px 2px 0}
.wk-head>span:first-child{font-weight:600}
.wk-tot{font-size:18px;color:var(--text)}
.tday-head{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px;color:var(--text-2);border-radius:var(--r) var(--r) 0 0}
.te{display:grid;grid-template-columns:32px minmax(120px,1fr) minmax(0,auto) auto 34px auto 32px 76px 32px 32px;gap:8px;align-items:center;padding:6px 10px 6px 12px;border-bottom:1px solid var(--line)}
.te:last-child{border-bottom:0}
.te.child{background:var(--surface-2)}
.te-desc{border-color:transparent;background:transparent;width:100%}
.te-desc:hover{border-color:var(--line)}
.te-proj{background:none;border:0;font:inherit;display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:4px;justify-self:start;min-width:0}
.te-proj svg{width:14px;height:14px}
.te-tags{background:none;border:0;cursor:pointer;color:var(--muted);display:inline-flex;gap:4px;flex-wrap:wrap;padding:4px;justify-content:flex-end}
.te-tags svg{width:18px;height:18px}
.tag.t-blue{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:500}
.te-bill{background:none;border:0;font:700 16px var(--font);color:var(--muted);cursor:pointer}
.te-bill.on{color:var(--accent)}
.te-times{display:inline-flex;align-items:center;gap:4px}
.te-times input{border-color:transparent;background:transparent;padding:4px;width:52px;text-align:center}
.te-times input:hover{border-color:var(--line)}
.te-dur{font-weight:600;text-align:right}
.te>.btn.icon{opacity:.55}
.te:hover>.btn.icon{opacity:1}

/* ---------- Dashboard ---------- */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.kpis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr);text-align:center;background:var(--surface-2);border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;padding:18px 12px}
.kpis .label{font-size:12px;color:var(--muted)}
.kpis .v{font-size:26px;font-weight:600;margin-top:2px}
.kpis .v.sm{font-size:18px;padding-top:6px}
.dash-split{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:center;padding:16px;border-top:1px solid var(--line)}
.donut-wrap{display:flex;justify-content:center}
.donut circle[data-tip]:hover{opacity:.85}
.donut-t{font-size:15px;font-weight:600;fill:var(--text)}
.dlist{display:flex;flex-direction:column;gap:8px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 72px 30% 56px;gap:10px;align-items:center;font-size:13px}
.drow .dn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.drow .track{height:16px;background:var(--grid);border-radius:2px;overflow:hidden}
.drow .track span{display:block;height:100%}
.side-list .act{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.side-list .act:last-child{border-bottom:0}
.side-list .desc{min-width:0}
.side-list .desc>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Team ---------- */
.rate{display:inline-flex;align-items:center;gap:10px}
.rate .num{min-width:70px;display:inline-block;background:var(--surface-2);padding:4px 8px;border-radius:4px}
.rolebtn{background:none;border:0;padding:0;cursor:pointer}

/* ---------- Toast ---------- */
.toasts{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--text);color:var(--surface);padding:10px 14px;border-radius:var(--r-sm);box-shadow:var(--shadow-lg);font-size:13px;max-width:360px}
.toast.err{background:var(--bad);color:#fff}

/* ---------- Auth ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:16px}
.auth .card{width:100%;max-width:400px;padding:28px}
.auth .brand{justify-content:center;font-size:24px;padding-bottom:6px}
.auth form{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.auth .err{background:var(--bad-soft);color:var(--bad);padding:8px 12px;border-radius:var(--r-sm);font-size:13px}
.auth .ok{background:var(--good-soft);color:var(--good);padding:8px 12px;border-radius:var(--r-sm);font-size:13px}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;padding:0}
.setup{max-width:640px;margin:60px auto;padding:24px}
.setup code{background:var(--surface-2);padding:2px 6px;border-radius:4px}

/* ---------- Responsive ---------- */
@media (max-width:1100px){ .tiles{grid-template-columns:repeat(2,1fr)} .cols{grid-template-columns:1fr} .dash{grid-template-columns:minmax(0,1fr)} .sum-split{grid-template-columns:minmax(0,1fr)} .sum-split .donut-wrap{border-left:0;border-top:1px solid var(--line)} }
@media (max-width:1000px){
  .te{grid-template-columns:28px minmax(0,1fr) auto auto auto;grid-auto-flow:row dense}
  .te-desc{grid-column:2/-1}
  .te-proj{grid-column:2/-1}
  .te-ico{display:none}
}
@media (max-width:820px){
  .hide-sm{display:none}
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:240px;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-lg)}
  .shell.nav-open .side{transform:none}
  .mobile-top{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);font-weight:700}
  .content{padding:16px}
  .timerbar{padding:8px 12px;flex-wrap:wrap}
  .timerbar input.desc{flex-basis:100%}
  .timerbar .clock{margin-left:auto}
  .dash-split{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:minmax(0,1fr)}
  .drow{grid-template-columns:minmax(0,1fr) 64px 56px}
  .drow .track{display:none}
  .kpis .v{font-size:20px}
  .range .btn:first-child{min-width:0}
  .fbtn{padding:6px 8px}
  .filterbar>input{margin-left:0;flex:1}
  .grid2{grid-template-columns:1fr}
  th,td{padding:8px 10px}
  .cal{grid-template-columns:40px repeat(var(--cols,7),minmax(0,1fr))}
  .cal-scroll{grid-template-columns:40px repeat(var(--cols,7),minmax(0,1fr))}
  .cal-dayhead .dn{font-size:10px}
  .cal-ev .s{display:none}
  .cal-dayhead .tot{display:none}
}
@media (max-width:480px){ .tiles{grid-template-columns:1fr 1fr;gap:10px} .tile .value{font-size:22px} }
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
